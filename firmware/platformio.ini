; PlatformIO Project Configuration File for Smart Home IoT (Nhom 05)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = integrated

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    ; Cac thu vien chuyen biet cho tung chuc nang se duoc them vao env tuong ung:
    ; - DHT22: beegee-tokyo/DHT sensor library for ESPx
    ; - LCD 2004 I2C: marcoschwartz/LiquidCrystal_I2C
    ; - MFRC522: miguelbalboa/MFRC522
    ; - Servo: madhephaestus/ESP32Servo
build_flags =
    -DMQTT_MAX_PACKET_SIZE=512

[env:kiet]
build_flags = ${env.build_flags} -DBUILD_KIET
build_src_filter = +<*> -<modules/quy/> -<modules/phat/>

[env:quy]
build_flags = ${env.build_flags} -DBUILD_QUY
build_src_filter = +<*> -<modules/kiet/> -<modules/phat/>

[env:phat]
build_flags = ${env.build_flags} -DBUILD_PHAT
build_src_filter = +<*> -<modules/kiet/> -<modules/quy/>

[env:integrated]
build_flags = ${env.build_flags} -DBUILD_KIET -DBUILD_QUY -DBUILD_PHAT
